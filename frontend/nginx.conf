# Nginx config for the salon frontend container.
# Serves the built React SPA and reverse-proxies API + WebSocket traffic to the
# backend service (so the browser can keep using relative /api and /ws URLs).

upstream salon_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not cache the HTML shell (so new deploys are picked up immediately).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-cache hashed static assets produced by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API -> backend. proxy_pass has no path, so the full /api/... URI is preserved.
    location /api/ {
        proxy_pass http://salon_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket / SockJS (STOMP) endpoint -> backend, with upgrade headers.
    location /ws {
        proxy_pass http://salon_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: everything else serves index.html (React Router handles routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
